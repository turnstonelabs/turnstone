# -- Container image settings
image:
  repository: ghcr.io/turnstonelabs/turnstone
  tag: ""
  pullPolicy: IfNotPresent

# -- Database configuration
database:
  # Backend type (postgresql or sqlite).
  #
  # sqlite is a single-node configuration, and the chart rejects the
  # combinations that pretend otherwise. Server and console are separate
  # pods that both read and write the registry, so they share the one
  # volume below — and they must share a node with it. The backend opens
  # the database in WAL mode, whose index lives in a mmap'd -shm file
  # that is only coherent between processes on the same host, so a
  # ReadWriteMany claim spread over two nodes corrupts rather than
  # shares. Pin both workloads with the nodeSelector/affinity keys below
  # and keep the claim ReadWriteOnce.
  #
  # Reach for postgresql for anything else. It is the only backend that
  # can serve more than one server replica, since replicas discover each
  # other through rows in the shared database.
  backend: postgresql
  # -- Persistent storage for the SQLite database. Ignored on
  # postgresql, where /data holds nothing durable.
  persistence:
    enabled: true
    # Bring your own claim; the chart then creates none.
    existingClaim: ""
    # Empty means the cluster default StorageClass.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}
  # External database settings (used when postgresql.enabled is false)
  external:
    host: ""
    port: 5432
    database: turnstone
    username: turnstone
    # Secret holding the password for `username`. Leave empty to supply
    # `password` inline below instead.
    existingSecret: ""
    # Key within existingSecret holding the password. CloudNativePG
    # generates "password"; other operators differ.
    existingSecretPasswordKey: password
    password: ""
    sslmode: prefer

# -- Bitnami PostgreSQL subchart
postgresql:
  enabled: true
  auth:
    database: turnstone
    username: turnstone

# -- Turnstone server (main API + web UI)
server:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8080
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  # -- Scratch paths, each backed by an emptyDir and unbounded unless
  # given a sizeLimit. Required by securityContext.readOnlyRootFilesystem
  # — emptying this list without also turning that off leaves the
  # container unable to write at all. /data is not here: it is the
  # working directory and, on sqlite, the database, so it is mounted
  # unconditionally and configured under database.persistence.
  writablePaths:
    - name: tmp
      path: /tmp
    - name: home
      path: /home/turnstone
    # Agent working files. The largest by some margin: checkouts, build
    # output, and whatever a session downloads all land here.
    - name: workspace
      path: /workspace

# -- Turnstone console (cluster dashboard)
console:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8090
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  # -- Scratch paths (see server.writablePaths). No /workspace: the
  # console serves the dashboard and runs no agent sessions.
  writablePaths:
    - name: tmp
      path: /tmp
    - name: home
      path: /home/turnstone

# -- Database migration Job (post-install/pre-upgrade hook)
migrate:
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  # -- Scratch paths
  writablePaths:
    - name: tmp
      path: /tmp
    - name: home
      path: /home/turnstone

# -- LLM provider configuration
llm:
  baseUrl: ""
  provider: openai
  apiKey: ""
  existingSecret: ""

# -- Authentication (always enabled, JWT secret required)
auth:
  jwtSecret: ""
  existingSecret: ""

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
