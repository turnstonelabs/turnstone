# -- Container image settings
image:
  repository: ghcr.io/turnstonelabs/turnstone
  tag: ""
  pullPolicy: IfNotPresent

# -- Database configuration
database:
  # Backend type (postgresql)
  backend: postgresql
  # External database settings (used when postgresql.enabled is false)
  external:
    host: ""
    port: 5432
    database: turnstone
    username: turnstone
    # Secret holding the password for `username`. Leave empty to supply
    # `password` inline below instead.
    existingSecret: ""
    # Key within existingSecret holding the password. CloudNativePG
    # generates "password"; other operators differ.
    existingSecretPasswordKey: password
    password: ""
    sslmode: prefer

# -- Bitnami PostgreSQL subchart
postgresql:
  enabled: true
  auth:
    database: turnstone
    username: turnstone

# -- Turnstone server (main API + web UI)
server:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
    labels: {}
    externalTrafficPolicy: ""
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # -- MCP servers that run in the server pod and share its /workspace with the
  # model's shell and file tools, for servers that work on the agent's files.
  # Each entry is a container spec (name, image, env, resources, securityContext
  # and so on) plus `port`, the port it listens on for Streamable HTTP, and an
  # optional `path` (default /mcp). The chart mounts the shared workspace at
  # /workspace in every entry, runs them as sidecars that are started before
  # the server, and prints each one's http://localhost:<port><path> in the
  # install notes for registration in the console. Sidecars receive none of
  # the chart's secret env, no service-account token and none of the
  # configuration file or Secret mounts. See README.md, "MCP servers", before
  # adding one.
  sidecars: []
  #  - name: toolchain
  #    image: registry.example.com/mcp/toolchain@sha256:...
  #    port: 9001
  #    env:
  #      - name: MCP_BEARER_TOKEN
  #        valueFrom:
  #          secretKeyRef:
  #            name: toolchain-mcp-token
  #            key: token
  #    resources:
  #      requests: {cpu: 50m, memory: 64Mi}
  #      limits: {cpu: 500m, memory: 256Mi}
  #    securityContext:
  #      runAsUser: 1000
  #      runAsNonRoot: true
  #      allowPrivilegeEscalation: false
  #      capabilities: {drop: [ALL]}

# -- Turnstone console (cluster dashboard)
console:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8090
    annotations: {}
    labels: {}
    externalTrafficPolicy: ""
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -- Database migration Job (post-install/pre-upgrade hook)
migrate:
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -- LLM API key (optional). Model backends are defined in the console
# Models tab; a definition that leaves api_key empty falls back to the
# OPENAI_API_KEY this feeds (a local server needs none).
llm:
  apiKey: ""
  existingSecret: ""

# -- Authentication. The JWT signing secret comes from `existingSecret` (a
# Secret with a TURNSTONE_JWT_SECRET key) or from `jwtSecret` inline; one of
# them is required, and the render stops without it.
auth:
  jwtSecret: ""
  existingSecret: ""

# -- Configuration file for the server and console. `file` is the text of a
# config.toml, rendered into a Secret and mounted read-only at
# /etc/turnstone/config.toml in both pods (TURNSTONE_CONFIG points there); a
# change rolls both Deployments. Use it for settings the chart has no value
# for: the `[secrets]` table that turns on secret:// references, and the
# startup secrets the chart cannot take otherwise (the `[security]` encryption
# keys, `[oidc] client_secret`, a Vault `secret_id`), which the Secret keeps
# out of plain view. The chart refuses what it owns: the `[database]`
# connection keys and `[auth] jwt_secret`. Its port flags beat the file. Text
# the chart cannot parse as TOML is refused at install; a file the application
# cannot read or parse, or a `[secrets]` table it rejects, stops the pods at
# startup. See
# README.md, "Configuration file".
config:
  file: ""
  # file: |
  #   [secrets]
  #   cache_ttl_seconds = 300
  #
  #   [secrets.file]
  #   root = "/run/turnstone/secrets"
  #
  #   [secrets.vault]
  #   address = "https://vault.example.com:8200"
  #   auth = "jwt"
  #   auth_mount = "kubernetes"
  #   role = "turnstone"
  #   jwt_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
  #   mount = "secret"
  # -- A Secret of your own whose `config.toml` key is the whole file, mounted
  # instead of `file`. The chart does not look inside it, so it refuses
  # nothing (leave the `[database]` connection keys out of it) and cannot roll
  # the pods when it changes (kubectl rollout restart). Set `file` or this, not
  # both.
  existingSecret: ""
  # -- Kubernetes Secrets mounted read-only into both pods, each at the path
  # given: under the `[secrets.file] root` for secret://file references, or
  # elsewhere for a Vault approle `secret_id_file`, which may not live under
  # the root. Each key of the Secret becomes a file in that directory. The
  # Secrets must exist before the pods start. Sidecars get none of these
  # mounts, nor the configuration file.
  secretMounts: []
  #  - name: toolchain-mcp-token
  #    mountPath: /run/turnstone/secrets/toolchain-mcp-token

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: turnstone.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  #        service: server
  tls: []
  #  - secretName: turnstone-tls
  #    hosts:
  #      - turnstone.example.com
