# -- Container image settings
image:
  repository: ghcr.io/turnstonelabs/turnstone
  tag: ""
  pullPolicy: IfNotPresent

# -- Database configuration
database:
  # Backend type (postgresql)
  backend: postgresql
  # External database settings (used when postgresql.enabled is false)
  external:
    host: ""
    port: 5432
    database: turnstone
    username: turnstone
    # Secret holding the password for `username`. Leave empty to supply
    # `password` inline below instead.
    existingSecret: ""
    # Key within existingSecret holding the password. CloudNativePG
    # generates "password"; other operators differ.
    existingSecretPasswordKey: password
    password: ""
    sslmode: prefer

# -- Bitnami PostgreSQL subchart
postgresql:
  enabled: true
  auth:
    database: turnstone
    username: turnstone

# -- Turnstone server (main API + web UI)
server:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
    labels: {}
    externalTrafficPolicy: ""
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # -- MCP servers that run in the server pod and share its /workspace with the
  # model's shell and file tools, for servers that work on the agent's files.
  # Each entry is a container spec (name, image, env, resources, securityContext
  # and so on) plus `port`, the port it listens on for Streamable HTTP, and an
  # optional `path` (default /mcp). The chart mounts the shared workspace at
  # /workspace in every entry, runs them as sidecars that are started before
  # the server, and prints each one's http://localhost:<port><path> in the
  # install notes for registration in the console. Sidecars receive none of
  # the chart's secret env and no service-account token. See README.md, "MCP
  # servers", before adding one.
  sidecars: []
  #  - name: toolchain
  #    image: registry.example.com/mcp/toolchain@sha256:...
  #    port: 9001
  #    env:
  #      - name: MCP_BEARER_TOKEN
  #        valueFrom:
  #          secretKeyRef:
  #            name: toolchain-mcp-token
  #            key: token
  #    resources:
  #      requests: {cpu: 50m, memory: 64Mi}
  #      limits: {cpu: 500m, memory: 256Mi}
  #    securityContext:
  #      runAsUser: 1000
  #      runAsNonRoot: true
  #      allowPrivilegeEscalation: false
  #      capabilities: {drop: [ALL]}

# -- Turnstone console (cluster dashboard)
console:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8090
    annotations: {}
    labels: {}
    externalTrafficPolicy: ""
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -- Database migration Job (post-install/pre-upgrade hook)
migrate:
  # -- Node scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -- LLM API key (optional). Model backends are defined in the console
# Models tab; a definition that leaves api_key empty falls back to the
# OPENAI_API_KEY this feeds (a local server needs none).
llm:
  apiKey: ""
  existingSecret: ""

# -- Authentication (always enabled, JWT secret required)
auth:
  jwtSecret: ""
  existingSecret: ""

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: turnstone.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  #        service: server
  tls: []
  #  - secretName: turnstone-tls
  #    hosts:
  #      - turnstone.example.com
