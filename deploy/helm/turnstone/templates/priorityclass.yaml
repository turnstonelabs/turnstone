{{- if .Values.priorityClass.enabled }}
# Cluster-scoped. Non-preempting: server pods are never preempted by lower
# priority pods, and never preempt anything themselves.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "turnstone.priorityClassName" . }}
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
preemptionPolicy: {{ .Values.priorityClass.preemptionPolicy }}
description: "Long-running Turnstone server nodes; protects in-flight agent work from preemption."
{{- end }}
