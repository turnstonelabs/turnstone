apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turnstone.fullname" . }}-server
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "turnstone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      {{- if .Values.config.file }}
      annotations:
        # The file is read at startup, so a changed text rolls the pods.
        checksum/config-file: {{ .Values.config.file | sha256sum }}
      {{- end }}
      labels:
        {{- include "turnstone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "turnstone.serviceAccountName" . }}
      {{- if .Values.server.sidecars }}
      # Sidecars get no service-account token: the pod stops mounting it, and
      # the server container gets the same token through a volume of its own.
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.server.sidecars }}
      # MCP sidecars are started before the server and stopped after it; each
      # shares the workspace volume below. See values.yaml, server.sidecars.
      initContainers:
        {{- include "turnstone.server.sidecars" . | trim | nindent 8 }}
      {{- end }}
      {{- if .Values.server.imagePullSecrets }}
      imagePullSecrets:
        {{- include "turnstone.server.imagePullSecrets" . | trim | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "turnstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # command replaces the image's entrypoint, and with it entrypoint.sh,
          # whose migrations the service and the migrate Job already run; tini
          # is named here so that, as PID 1, it reaps orphaned processes, such
          # as the helpers a stdio MCP server leaves behind, and forwards
          # signals to the service.
          command:
            - tini
            - --
            - turnstone-server
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.server.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "turnstone.fullname" . }}-config
            - secretRef:
                name: {{ include "turnstone.llm.secretName" . }}
                optional: true
          env:
            {{- include "turnstone.db.env" . | nindent 12 }}
            # Each replica is a distinct node in the rendezvous ring, so it
            # must advertise an address that reaches *itself*. The Service
            # DNS name would load-balance across every replica, sending
            # console traffic routed for node A to an arbitrary pod; the
            # default (gethostname(), i.e. the pod name) is not resolvable
            # at all. The pod IP is unique, routable in-cluster, and
            # re-registered on every start, so churn is self-healing.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TURNSTONE_ADVERTISE_URL
              value: "http://$(POD_IP):{{ .Values.server.service.port }}"
            {{- if or .Values.config.file .Values.config.existingSecret }}
            - name: TURNSTONE_CONFIG
              value: /etc/turnstone/config.toml
            {{- end }}
            - name: TURNSTONE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "turnstone.auth.secretName" . }}
                  key: TURNSTONE_JWT_SECRET
            {{- with include "turnstone.oidc.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if or .Values.server.sidecars .Values.config.file .Values.config.existingSecret .Values.config.secretMounts }}
          volumeMounts:
            {{- if .Values.server.sidecars }}
            - name: workspace
              mountPath: /workspace
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- with (include "turnstone.configFile.volumeMounts" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.server.sidecars .Values.config.file .Values.config.existingSecret .Values.config.secretMounts }}
      volumes:
        {{- with (include "turnstone.configFile.volumes" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.server.sidecars }}
        # Shared with every sidecar. The image names /workspace in the model's
        # tool descriptions (TURNSTONE_WORKSPACE), so the paths agree.
        - name: workspace
          emptyDir: {}
        # What automountServiceAccountToken would have mounted, for the server
        # container only.
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
      {{- end }}
