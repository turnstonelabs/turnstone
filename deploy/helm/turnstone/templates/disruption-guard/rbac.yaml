{{- if .Values.disruptionGuard.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "turnstone.fullname" . }}-disruption-guard
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: disruption-guard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "turnstone.fullname" . }}-disruption-guard
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: disruption-guard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "turnstone.fullname" . }}-disruption-guard
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: disruption-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "turnstone.fullname" . }}-disruption-guard
subjects:
  - kind: ServiceAccount
    name: {{ include "turnstone.fullname" . }}-disruption-guard
    namespace: {{ .Release.Namespace }}
{{- end }}
