{{- if and .Values.config.file .Values.config.existingSecret }}
{{- fail "config: set config.file or config.existingSecret, not both" }}
{{- end }}
{{- if .Values.config.file }}
{{- /* fromToml answers a one-key {Error: "toml: ..."} map for text it cannot parse. */}}
{{- $parsed := fromToml .Values.config.file }}
{{- if and (hasKey $parsed "Error") (eq (len $parsed) 1) (hasPrefix "toml:" (toString (get $parsed "Error"))) }}
{{- fail (printf "config.file: not valid TOML: %v" (get $parsed "Error")) }}
{{- end }}
{{- /* What the chart owns: the database connection, the JWT signing secret and the single sign-on keys that oidc.* sets. */}}
{{- $db := get $parsed "database" }}
{{- range $k := list "backend" "url" "path" "listen_url" }}
{{- if and (kindIs "map" $db) (hasKey $db $k) }}
{{- fail (printf "config.file: leave [database] %s out; the chart owns the database connection, and a file value would override or redirect it" $k) }}
{{- end }}
{{- end }}
{{- $auth := get $parsed "auth" }}
{{- if and (kindIs "map" $auth) (hasKey $auth "jwt_secret") }}
{{- fail "config.file: leave [auth] jwt_secret out; the chart passes auth.jwtSecret or auth.existingSecret as TURNSTONE_JWT_SECRET" }}
{{- end }}
{{- /* The env the oidc.* values become beats the file key by key, so a repeated key would be ignored silently. */}}
{{- $owned := list }}
{{- if .Values.oidc.issuer }}{{- $owned = concat $owned (list "issuer" "client_id" "client_secret") }}{{- end }}
{{- if .Values.oidc.redirectBase }}{{- $owned = append $owned "redirect_base" }}{{- end }}
{{- if .Values.oidc.scopes }}{{- $owned = append $owned "scopes" }}{{- end }}
{{- if .Values.oidc.providerName }}{{- $owned = append $owned "provider_name" }}{{- end }}
{{- $oidc := get $parsed "oidc" }}
{{- range $k := $owned }}
{{- if and (kindIs "map" $oidc) (hasKey $oidc $k) }}
{{- fail (printf "config.file: leave [oidc] %s out; the chart passes oidc.* as TURNSTONE_OIDC_* env, which would override it" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "turnstone.fullname" . }}-config-file
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- dict "config.toml" .Values.config.file | toYaml | nindent 2 }}
{{- end }}
