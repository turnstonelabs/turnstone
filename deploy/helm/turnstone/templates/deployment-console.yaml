apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turnstone.fullname" . }}-console
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  {{- if eq (int .Values.console.replicas) 1 }}
  # The console registers itself under the fixed service_id "console" and
  # deregisters on shutdown. Under RollingUpdate the outgoing pod's
  # deregister runs *after* the incoming pod registers and deletes its
  # row -- and the heartbeat only touches last_heartbeat, so the row is
  # never recreated and the console stays invisible in the registry until
  # the next clean start. Recreate orders shutdown strictly before
  # startup. Only valid at one replica; see console.replicas.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "turnstone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "turnstone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
        {{- with .Values.console.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.console.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "turnstone.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.console.terminationGracePeriodSeconds }}
      {{- with .Values.console.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "turnstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - turnstone-console
            - --host=0.0.0.0
            - --port={{ .Values.console.service.port }}
          ports:
            - name: http
              containerPort: {{ .Values.console.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "turnstone.fullname" . }}-config
            - secretRef:
                name: {{ include "turnstone.llm.secretName" . }}
                optional: true
          env:
            {{- include "turnstone.db.env" . | nindent 12 }}
            # Self-registration URL for the service registry. Unlike a
            # server node the console is one logical endpoint behind its
            # Service, so the Service DNS name is correct here. Stops at
            # ".svc" rather than assuming a "cluster.local" DNS domain.
            - name: TURNSTONE_CONSOLE_URL
              value: "http://{{ include "turnstone.fullname" . }}-console.{{ .Release.Namespace }}.svc:{{ .Values.console.service.port }}"
            {{- include "turnstone.jwt.env" . | nindent 12 }}
            {{- include "turnstone.config.env" . | nindent 12 }}
            {{- with .Values.console.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- include "turnstone.config.mount" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir:
            {{- with .Values.console.persistence.data.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- include "turnstone.config.volume" . | nindent 8 }}
