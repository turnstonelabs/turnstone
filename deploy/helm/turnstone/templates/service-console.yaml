apiVersion: v1
kind: Service
metadata:
  name: {{ include "turnstone.fullname" . }}-console
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
    {{- with .Values.console.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.console.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.console.service.type }}
  {{- with .Values.console.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "turnstone.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
