# Turnstone local inference — 3 models co-resident on ONE unified-memory
# Discrete-GPU operators: all tunables are ${VAR:-default} (reference values
# are the defaults). Machine-specific values live ONLY in local untracked
# `.env` — never in this file. See .env.example (commented block).
# accelerator (NVIDIA DGX Spark / GB10, or AMD Ryzen AI MAX "Strix Halo"),
# behind a LiteLLM gateway serving BOTH chat API routes at once:
#
#   /v1/messages          (Anthropic)  -> qwen      reasoning + tools
#   /v1/chat/completions  (OpenAI)     -> gemma     perception (vision + audio)
#   (direct)              /rerank      -> reranker  retrieval rerank
#
# Models load by HF id into a mounted HF_HOME cache (set HF_TOKEN for gated
# repos; first `up` downloads them, then they're cached on disk under HF_CACHE).
# This file targets NVIDIA/CUDA; for AMD ROCm see README.md.
#
# Validated on a GB10 Spark (128 GiB): qwen 256K, gemma 131072, reranker,
# ~117/121 GiB used. Two hard rules on one unified-memory card
# (see README -> Troubleshooting): drop the page cache before `up`, and start
# sequentially (enforced via depends_on) so each model profiles clean memory.
#
# gpu-memory-utilization is a fraction of TOTAL unified memory; the three must
# sum below ~0.9. Tune for your card.
name: turnstone-inference

services:
  # --- reasoning + tools : Qwen 3.6 27B (NVFP4, MTP spec-decode, full 256K) ----
  # max-num-seqs is a scheduler limit, not a memory allocator — bump from the
  # default 2 to 8 for better throughput under concurrent load.
  vllm-qwen:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    entrypoint: ["/usr/local/bin/vllm-entrypoint.sh"]
    command:
      - --model
      - ${QWEN_MODEL:-nvidia/Qwen3.6-27B-NVFP4}
      - --served-model-name
      - ${QWEN_SERVED_NAME:-qwen3.6-27b}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --trust-remote-code
      - --load-format
      - runai_streamer
      - --gpu-memory-utilization
      - "${QWEN_GPU_UTIL:-0.50}"
      - --max-model-len
      - "${QWEN_MAX_MODEL_LEN:-262144}"
      - --max-num-batched-tokens
      - "${QWEN_MAX_BATCHED_TOKENS:-8192}"
      - --max-num-seqs
      - "${QWEN_MAX_SEQS:-8}"
      - --enable-prefix-caching
      - --speculative-config
      - '{"method": "mtp", "num_speculative_tokens": ${QWEN_SPEC_TOKENS:-2}}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --default-chat-template-kwargs
      - '{"preserve_thinking": true, "enable_thinking": true}'
    environment:
      HF_HOME: /hf
      HF_TOKEN: ${HF_TOKEN:-}
      TRITON_CACHE_DIR: /root/.triton/cache
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torch/inductor
      VLLM_SPEC_CONFLICT: ${VLLM_SPEC_CONFLICT:-prefer-mtp}
      MOE_BACKEND: ${QWEN_MOE_BACKEND:-}
      LINEAR_BACKEND: ${QWEN_LINEAR_BACKEND:-}
      ATTENTION_BACKEND: ${QWEN_ATTENTION_BACKEND:-}
      CPU_OFFLOAD_GB: ${QWEN_CPU_OFFLOAD_GB:-}
      CPU_OFFLOAD_PARAMS: ${QWEN_CPU_OFFLOAD_PARAMS:-}
      OFFLOAD_BACKEND: ${QWEN_OFFLOAD_BACKEND:-}
      KV_OFFLOADING_SIZE: ${QWEN_KV_OFFLOAD_SIZE:-}
      KV_OFFLOADING_BACKEND: ${QWEN_KV_OFFLOAD_BACKEND:-}
      LMCACHE_HOST: ${LMCACHE_HOST:-lmcache}
      LMCACHE_PORT: ${LMCACHE_PORT:-5555}
      CUTE_DSL_ARCH: ${CUTE_DSL_ARCH:-}
    volumes:
      - ${HF_CACHE:-./hf-cache}:/hf
      - ${COMPILE_CACHE:-./compile-cache}/triton:/root/.triton/cache
      - ${COMPILE_CACHE:-./compile-cache}/torch:/root/.cache/torch/inductor
      - ${COMPILE_CACHE:-./compile-cache}/flashinfer:/root/.cache/flashinfer
      - ./vllm-entrypoint.sh:/usr/local/bin/vllm-entrypoint.sh:ro
    ports:
      - "${QWEN_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 1800s          # first run also downloads the weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia        # AMD: delete this deploy: block, see README
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  # --- perception : Gemma 4 12B (vision + audio) via the OpenAI lane -----------
  # FP16 KV cache is fine here — sliding_window keeps KV cheap at 131K context.
  vllm-gemma:
    build:
      context: .
      dockerfile: gemma.Dockerfile   # adds vllm[audio] for the audio path
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    image: turnstone-inference/vllm-gemma-audio
    entrypoint: ["/usr/local/bin/vllm-entrypoint.sh"]
    command:
      - --model
      - ${GEMMA_MODEL:-google/gemma-4-12b-it}
      - --served-model-name
      - ${GEMMA_SERVED_NAME:-gemma-4-12b}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --trust-remote-code
      - --gpu-memory-utilization
      - "${GEMMA_GPU_UTIL:-0.24}"
      - --max-model-len
      - "${GEMMA_MAX_MODEL_LEN:-131072}"
      - --max-num-batched-tokens
      - "${GEMMA_MAX_BATCHED_TOKENS:-4096}"
      - --enable-auto-tool-choice
      - --reasoning-parser
      - gemma4
      - --tool-call-parser
      - gemma4
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
    environment:
      HF_HOME: /hf
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_SPEC_CONFLICT: ${VLLM_SPEC_CONFLICT:-prefer-mtp}
    volumes:
      - ${HF_CACHE:-./hf-cache}:/hf
      - ./vllm-entrypoint.sh:/usr/local/bin/vllm-entrypoint.sh:ro
    ports:
      - "${GEMMA_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 1800s
    depends_on:
      vllm-qwen:
        condition: service_healthy   # SEQUENTIAL STARTUP — qwen claims KV first
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia          # AMD: delete this deploy: block, see README
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  # --- retrieval : Qwen3-Reranker 4B (Cohere/Jina /rerank, direct) ---------------
  # Light 4B reranker so it co-resides with the full 12B perception model. Its
  # chat template ships in the repo (vLLM loads it); add --chat-template if your
  # build needs it explicitly.
  vllm-reranker:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    entrypoint: ["/usr/local/bin/vllm-entrypoint.sh"]
    command:
      - --model
      - ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-4B}
      - --served-model-name
      - ${RERANKER_SERVED_NAME:-qwen3-reranker-4b}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --runner
      - pooling
      - --hf-overrides
      - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --gpu-memory-utilization
      - "${RERANKER_GPU_UTIL:-0.10}"
    environment:
      HF_HOME: /hf
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_SPEC_CONFLICT: ${VLLM_SPEC_CONFLICT:-prefer-mtp}
    volumes:
      - ${HF_CACHE:-./hf-cache}:/hf
      - ./vllm-entrypoint.sh:/usr/local/bin/vllm-entrypoint.sh:ro
    ports:
      - "${RERANKER_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 900s
    depends_on:
      vllm-gemma:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia          # AMD: delete this deploy: block, see README
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  # --- gateway : both chat API routes on :4000 -------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_TAG:-main-stable}
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/etc/litellm/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      vllm-qwen:
        condition: service_healthy
      vllm-gemma:
        condition: service_healthy
    restart: unless-stopped

  # --- optional KV cache : standalone LMCache (profile-gated, OFF by default) --
  # Reference path never starts this. `docker compose --profile lmcache up
  # lmcache` first (or add `--profile lmcache` to the vllm up), then set
  # QWEN_KV_OFFLOAD_BACKEND=lmcache + QWEN_KV_OFFLOAD_SIZE=<GiB> in local .env.
  lmcache:
    image: ${LMCACHE_IMAGE:-lmcache/standalone:nightly}
    command:
      - /opt/venv/bin/lmcache
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "${LMCACHE_PORT:-5555}"
      - --l1-size-gb
      - ${LMCACHE_L1_GB:-20}
      - --eviction-policy
      - LRU
      - --l2-adapter
      - '{"type": "fs", "base_path": "/data/lmcache"}'
    volumes:
      - ${LMCACHE_DIR:-./lmcache-data}:/data/lmcache
    ports:
      - "${LMCACHE_PORT:-5555}:${LMCACHE_PORT:-5555}"
    profiles: ["lmcache"]
    restart: unless-stopped
