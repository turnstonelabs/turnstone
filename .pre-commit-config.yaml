repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        entry: mypy turnstone/

  - repo: local
    hooks:
      - id: lint-hypothesis
        name: HYPOTHESIS.md math delimiters and residues
        entry: python lint_hypothesis.py --check
        language: python
        files: ^(HYPOTHESIS\.md|lint_hypothesis\.py)$
        pass_filenames: false
